services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-reposcope}
      POSTGRES_USER: ${POSTGRES_USER:-reposcope}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-reposcope}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  migrate:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-reposcope}:${POSTGRES_PASSWORD:-reposcope}@postgres:5432/${POSTGRES_DB:-reposcope}
    depends_on:
      postgres:
        condition: service_healthy
    command: ["alembic", "upgrade", "head"]
    restart: "no"

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-reposcope}:${POSTGRES_PASSWORD:-reposcope}@postgres:5432/${POSTGRES_DB:-reposcope}
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "8000:8000"

  worker:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-reposcope}:${POSTGRES_PASSWORD:-reposcope}@postgres:5432/${POSTGRES_DB:-reposcope}
      SNAPSHOT_ROOT: /var/lib/reposcope/snapshots
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      REPOSCOPE_OPENAI_API_KEY: ${REPOSCOPE_OPENAI_API_KEY:-}
      REPOSCOPE_OPENAI_BASE_URL: ${REPOSCOPE_OPENAI_BASE_URL:-}
      REPOSCOPE_OPENAI_MODEL: ${REPOSCOPE_OPENAI_MODEL:-gpt-5-mini}
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: ["python", "-m", "app.worker_main"]
    restart: unless-stopped
    volumes:
      - snapshots:/var/lib/reposcope/snapshots

  frontend:
    build:
      context: ./frontend
      args:
        VITE_REPOSCOPE_MODE: live
        VITE_API_BASE_URL: ""
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "5173:80"

volumes:
  postgres_data:
  snapshots:
