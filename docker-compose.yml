services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-reposcope}
      POSTGRES_USER: ${POSTGRES_USER:-reposcope}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-reposcope}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-reposcope}:${POSTGRES_PASSWORD:-reposcope}@postgres:5432/${POSTGRES_DB:-reposcope}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_REPOSCOPE_MODE: live
        VITE_API_BASE_URL: ""
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "5173:80"

volumes:
  postgres_data:
