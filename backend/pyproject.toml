[project]
name = "reposcope-api"
version = "0.1.0"
description = "Read-only static repository analysis API"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14,<2.0",
  "fastapi>=0.115,<1.0",
  "httpx>=0.27,<1.0",
  "langchain-openai>=1.6,<2.0",
  "langgraph>=1.2,<2.0",
  "langgraph-checkpoint-postgres>=3.1,<4.0",
  "psycopg[binary,pool]>=3.2,<4.0",
  "pydantic>=2.9,<3.0",
  "pydantic-settings>=2.6,<3.0",
  "sqlalchemy>=2.0,<3.0",
  "uvicorn[standard]>=0.30,<1.0",
]

[project.scripts]
reposcope-eval = "app.evaluation.cli:main"
reposcope-development-predict = "app.evaluation.online_run:main"
reposcope-development-score = "app.evaluation.development_score:main"

[project.optional-dependencies]
dev = [
  "aiosqlite>=0.20,<1.0",
  "pytest>=8.0,<9.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
